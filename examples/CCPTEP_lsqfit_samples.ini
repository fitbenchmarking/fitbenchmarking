; Options for benchmarking the lattice correlator plateau fits in
; examples/benchmark_problems/CCPTEP_lsqfit_samples.
;
; Run with:
;   fitbenchmarking -o examples/CCPTEP_lsqfit_samples.ini \
;                   -p examples/benchmark_problems/CCPTEP_lsqfit_samples
;
; Note: these problems ship diagonal errors only, while the published analysis
; uses the full covariance over the plateau window.  See the README in the
; problem directory.

[FITTING]
software: scipy_ls
          scipy
          gsl
          scipy_leastsq

cost_func_type: whitened_nlls
jac_method: gvar 
num_runs: 5

[JACOBIAN]
gvar: forward_ad


[MINIMIZERS]
scipy_ls: lm-scipy
          trf
          dogbox

scipy: BFGS
       Nelder-Mead
       Powell

gsl: nmsimplex
     conjugate_pr
     conjugate_fr
     vector_bfgs
     vector_bfgs2
     steepest_descent

scipy_leastsq: lm-leastsq

[OUTPUT]
results_dir: lattice_correlator_results
make_plots: yes

[LOGGING]
level: INFO
