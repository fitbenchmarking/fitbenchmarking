; Options for benchmarking the lattice correlator plateau fits in
; examples/benchmark_problems/Lattice_Correlators.
;
; Run with:
;   fitbenchmarking -o examples/lattice_correlators.ini \
;                   -p examples/benchmark_problems/Lattice_Correlators
;
; Note: these problems ship diagonal errors only, while the published analysis
; uses the full covariance over the plateau window.  See the README in the
; problem directory.

[FITTING]
software: scipy_ls
          scipy
          minuit
          dfo
cost_func_type: weighted_nlls
jac_method: scipy
num_runs: 5

[MINIMIZERS]
scipy_ls: lm-scipy
          trf
          dogbox
scipy: Nelder-Mead
       Powell
       CG
       BFGS
       L-BFGS-B

[OUTPUT]
results_dir: lattice_correlator_results
make_plots: yes

[LOGGING]
level: INFO
