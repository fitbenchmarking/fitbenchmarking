# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
  - id: check-merge-conflict

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.5
  hooks:
    # Run the linter.
    - id: ruff
      args: []
    # Run the formatter.
    - id: ruff-format
      args: [--check]

- repo: local
  hooks:
    - id: spelling-check
      name: Check spelling
      entry: python3 .custom_hooks/minimizer_spelling.py
      language: system
      files: '\.(py|md|html|rst)$'

ci:
  skip: [spelling-check]
